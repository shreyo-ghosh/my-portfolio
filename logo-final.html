<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LaunchLayer — Final logo</title>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#07070b; color:#e8e8f0; font-family:system-ui,sans-serif; }
    .box { text-align:center; padding:2rem; }
    img { width:min(360px,80vw); height:auto; border-radius:28px; border:1px solid rgba(255,255,255,.08); }
    h1 { margin:1.2rem 0 .4rem; font-size:1.4rem; }
    p { color:#8a8aa0; max-width:28rem; margin:0 auto 1rem; line-height:1.5; }
    a { color:#f5a623; }
    .row { display:flex; gap:1rem; justify-content:center; flex-wrap:wrap; margin-top:1.5rem; }
    .row img { width:120px; border-radius:16px; }
  </style>
</head>
<body>
  <div class="box">
    <img src="/brand/logo-final.png" alt="LaunchLayer radial asterisk logo" />
    <h1>Selected: Radial Asterisk</h1>
    <p>Upload to LinkedIn: <a href="/brand/logo-linkedin-300.png">logo-linkedin-300.png</a></p>
    <div class="row">
      <img src="/logo-mark.svg" alt="SVG mark" />
      <img src="/favicon.svg" alt="Favicon" />
      <img src="/logo-lockup.svg" alt="Lockup" style="width:280px; background:#0a0a0f; padding:12px; border-radius:12px;" />
    </div>
  </div>
</body>
</html>
